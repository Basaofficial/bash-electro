/* bash-electro v3. Tokens: bare :root = AMOLED, [data-theme=light], [data-theme=glass]; auto follows the OS. */
:root{

  color-scheme:dark;
}

  --fg:#0d1409; --mu:#566350; --act:color-mix(in srgb,var(--ac) 52%,#000); --inp:rgba(10,30,0,.055); --hi:rgba(255,255,255,.8); --sh:rgba(40,60,20,.22); --scr:rgba(20,30,10,.35);
  --v3a:#f7f9f2; --v3b:#e3e9da; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f1f4ec; --panel:rgba(255,255,255,.92); --panel2:#fff; --line:rgba(20,40,5,.12); --line2:rgba(80,120,0,.35);
  --fg:#0d1409; --mu:#566350; --act:color-mix(in srgb,var(--ac) 52%,#000); --inp:rgba(10,30,0,.055); --hi:rgba(255,255,255,.8); --sh:rgba(40,60,20,.22); --scr:rgba(20,30,10,.35);
  --v3a:#f7f9f2; --v3b:#e3e9da; color-scheme:light}
:root[data-theme="glass"]{
  --bg:#070b1c;
  --bgi:radial-gradient(900px 640px at 8% -8%,rgba(64,110,255,.55),transparent 62%),radial-gradient(800px 600px at 105% 18%,rgba(190,70,255,.42),transparent 60%),radial-gradient(900px 700px at 40% 112%,rgba(0,200,170,.38),transparent 60%);
  --panel:rgba(255,255,255,.11); --panel2:rgba(255,255,255,.16); --line:rgba(255,255,255,.24); --line2:rgba(255,255,255,.45);
  --fg:#fff; --mu:rgba(255,255,255,.66); --inp:rgba(255,255,255,.13); --hi:rgba(255,255,255,.42); --sh:rgba(10,12,40,.5); --scr:rgba(5,8,30,.55);

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

  padding-block:68px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
@media(max-width:999px){body{padding-bottom:calc(var(--bn) + 28px + env(safe-area-inset-bottom,0px))}}
#pcl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

@media(min-width:1000px){#app{margin-left:calc(var(--rail) + 8px)}}

.brand{font:700 18px var(--fd);padding:4px 10px 14px;letter-spacing:.2px}.brand b{color:var(--act)}

.bn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--mu);font:600 10.5px var(--fd);border-radius:calc(var(--r) + 4px);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s}
.bn.on{background:var(--inp);color:var(--fg);box-shadow:inset 0 1px 0 var(--hi)}
.bn.on svg{color:var(--act)}
.panel{background:var(--panel);backdrop-filter:blur(var(--pbl)) saturate(170%);-webkit-backdrop-filter:blur(var(--pbl)) saturate(170%);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:var(--pad);min-width:0;box-shadow:inset 0 1px 0 var(--hi),0 18px 40px -22px var(--sh)}
.panel h2{font:600 15px var(--fd);margin:0 0 10px}.panel h3{font:600 13px var(--fd);margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--pad);align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);backdrop-filter:blur(var(--pbl));-webkit-backdrop-filter:blur(var(--pbl));border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:inset 0 1px 0 var(--hi)}
.kpi span{display:block;font-size:12px;color:var(--mu)}.kpi b{display:block;font:500 22px var(--fm);margin-top:2px;font-variant-numeric:tabular-nums}.kpi small{color:var(--mu);font-size:11px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}.head h2{font:600 22px var(--fd);margin:0;flex:1;min-width:200px}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;border-radius:99px;padding:1px 10px;font-size:12px;margin:2px 4px 2px 0}

input,select,textarea{font:inherit;color:var(--fg);background:var(--inp);border:1px solid var(--line);border-radius:calc(var(--r) - 3px);padding:9px 11px;min-width:0;width:100%;box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}

label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
/* layered buttons */
.btn{appearance:none;position:relative;font:600 13px var(--fd);color:var(--on);padding:10px 16px;min-height:38px;border-radius:calc(var(--r) - 1px);border:1px solid color-mix(in srgb,var(--ac) 55%,#000);cursor:pointer;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 74%,#fff) 0%,var(--ac) 48%,color-mix(in srgb,var(--ac) 80%,#000) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 3px rgba(0,0,0,.24),0 1px 1.5px rgba(0,0,0,.5),0 10px 24px -9px color-mix(in srgb,var(--ac) 70%,transparent);
  transition:transform .16s cubic-bezier(.3,1.5,.5,1),box-shadow .16s,filter .16s;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 0 rgba(255,255,255,.25)}

.btn.g{color:var(--fg);text-shadow:none;border-color:var(--line);background:linear-gradient(180deg,var(--hi),rgba(255,255,255,.015) 62%),var(--inp);backdrop-filter:blur(14px) saturate(170%);-webkit-backdrop-filter:blur(14px) saturate(170%);

.btn.g.on{border-color:var(--ac);box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--ac),0 6px 20px -6px color-mix(in srgb,var(--ac) 65%,transparent)}

.sheet[hidden]{display:none}
.sh-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}.sh-h h3{margin:0;font:600 16px var(--fd);flex:1;min-width:0}.sh-h small{display:block;font:400 12px var(--fm);color:var(--mu)}

 ['projekt','Projekt','M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6'],
 ['postavke','Postavke','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4'],

let FLY=true;
/* ---------- stanje ---------- */
const K='be2';

function load(){try{const r=JSON.parse(localStorage.getItem(K));if(r&&(r.v==2||r.v==3)&&Array.isArray(r.c)&&Array.isArray(r.rooms))return r}catch(e){}return null}

/* ---------- generiranje krugova iz prostorija ---------- */
function gen(silent){
  const R=S.rooms,G=[];
  const pack=(rs,k,cap)=>{const gs=[];let g=null;rs.forEach(r=>{const n=r[k]||0;if(!n)return;if(!g||(g.n+n>cap&&g.n>0)){g={n:0,rs:[]};gs.push(g)}g.n+=n;g.rs.push(r)});return gs};
  const nm=g=>{const a=g.rs.map(r=>r.name);return a.length>3?a.slice(0,3).join(', ')+' …':a.join(', ')};
  const Lest=g=>Math.round(8+3*g.rs.length+1.5*Math.sqrt(g.rs.reduce((s,r)=>s+(+r.area||0),0)));
  pack(R,'l',10).forEach((g,i)=>G.push({key:'L'+(i+1),kind:'licht',name:'Licht '+nm(g),P:Math.max(100,g.n*50),cos:.95,In:10,ch:'B',A:1.5,rcd:'A',gz:.7,L:Lest(g),out:{l:g.n},rooms:g.rs.map(r=>r.id)}));
  const buckets=[['Küche','Küche'],['Bad','Bad'],['Garage','Garage'],[null,'']];
  buckets.forEach(([t,lab])=>{
    const rs=R.filter(r=>t?r.type==t:!['Küche','Bad','Garage'].includes(r.type));
    pack(rs,'s',8).forEach((g,i)=>G.push({key:'S:'+(t||'x')+(i+1),kind:'steck',name:'Steckdosen '+nm(g),P:Math.min(3680,g.n*400),cos:1,In:16,ch:'B',A:1.5,rcd:'A',gz:.4,L:Lest(g),out:{s:g.n},rooms:g.rs.map(r=>r.id)}))});
  R.forEach(r=>r.ap.forEach((k,i)=>{const d=APP[k];if(!d)return;
    G.push({key:'A:'+r.id+':'+k+':'+i,kind:'geraet',name:d.n+' · '+r.name,P:d.P,ph:d.ph,cos:d.cos,In:d.In,ch:d.ch,A:d.A,rcd:d.rcd,gz:d.gz,L:Math.round(d.L0+1.5*Math.sqrt(+r.area||0)),out:null,rooms:[r.id]})}));
  const keys=new Set(G.map(g=>g.key)),old=new Map(S.c.filter(c=>c.key).map(c=>[c.key,c]));
  let add=0,upd=0,del=0;
  S.c=S.c.filter(c=>{if(!c.key||keys.has(c.key))return true;del++;return false});

/* ---------- proračun ---------- */
function calc(c){
  if(!(c.A>0))c.A=1.5;if(!(c.cos>0)||c.cos>1)c.cos=1;if(!(c.L>0))c.L=1;if(!(c.P>=0))c.P=0;if(!(c.In>0))c.In=16;
  /* ravnomjerno raspoređeno opterećenje (više utičnica/svjetala na jednom krugu): efektivna duljina za ΔU */
  const nOut=c.out?(c.out.s||c.out.l||0):0,Le=nOut>1?c.L*(nOut+1)/(2*nOut):c.L;
  const t3=c.ph==3,Ib=t3?c.P/(Math.sqrt(3)*400*(c.cos||1)):c.P/(230*(c.cos||1));
  const Iz=((t3?IZ3:IZ2)[c.A]||0)*(VL[c.vl]||VL.B2)[1];
  const dU=t3?Math.sqrt(3)*Le*Ib*(c.cos||1)/(56*c.A*400)*100:2*Le*Ib*(c.cos||1)/(56*c.A*230)*100;
  const Zs=S.p.zv+2*c.L/(48*c.A),Ik=230/Zs,k=c.ch=='B'?5:10,need=k*c.In,zmax=230/need,is=[];
  if(Ib>c.In)is.push(['er','Ib '+fmt(Ib)+' A > In '+c.In+' A (preopterećenje)']);
  if(c.In>Iz)is.push(['er','In '+c.In+' A > Iz '+fmt(Iz)+' A (presjek '+fa(c.A)+' mm² premali)']);

function size(c){
  const t3=c.ph==3,Ib=t3?c.P/(Math.sqrt(3)*400*(c.cos||1)):c.P/(230*(c.cos||1));
  const ap=c.kind=='geraet'&&c.key&&c.key.startsWith('A:')?APP[c.key.split(':')[2]]:null;
  const mn=c.kind=='licht'?10:c.kind=='steck'?16:ap?ap.In:6;
  c.In=[6,10,16,20,25,32,40,50,63].find(v=>v>=Math.max(Ib,mn))||63;
  for(const a of AS){if(ap&&a<ap.A&&a<35)continue;c.A=a;const r=calc(c);if(c.In<=r.Iz&&r.dU<=S.p.lim&&r.Ik>=r.need)break}
}
function model(){
  const rows=S.c.map(c=>Object.assign({c},calc(c)));
  const pl=[0,0,0];
  rows.map((r,i)=>i).sort((a,b)=>rows[b].c.P-rows[a].c.P).forEach(i=>{const r=rows[i],va=r.c.P/(r.c.cos||1);
    if(r.c.ph==3){r.phase='L1+L2+L3';pl[0]+=va/3;pl[1]+=va/3;pl[2]+=va/3}else if(/^L[123]$/.test(r.c.phSel)){const k=+r.c.phSel[1]-1;r.phase=r.c.phSel;pl[k]+=va}else{const m=pl.indexOf(Math.min(...pl));r.phase='L'+(m+1);pl[m]+=va}});
  const maxN=Math.max(1,S.p.maxN|0),groups=[];
  ['A','F','B'].forEach(t=>{const idx=rows.map((r,i)=>i).filter(i=>(['A','F','B'].includes(rows[i].c.rcd)?rows[i].c.rcd:'A')==t),n=t=='B'?1:maxN;
    for(let j=0;j<idx.length;j+=n)groups.push({t,idx:idx.slice(j,j+n)})});
  groups.forEach((g,gi)=>{g.id=gi+1;const sum=g.idx.reduce((s,i)=>s+rows[i].Ib*(rows[i].c.gz||1),0),mx=Math.max(...g.idx.map(i=>rows[i].c.In));
    g.In=[25,40,63,80,100].find(v=>v>=Math.max(sum,mx))||125;
    g.idx.forEach((i,k)=>{rows[i].g=g.id;rows[i].k=k+1;rows[i].bmk='-F'+g.id+'.'+(k+1)})});
  const tot=rows.reduce((s,r)=>s+r.c.P,0),sim=rows.reduce((s,r)=>s+r.c.P*r.c.gz,0),Ibt=sim/(Math.sqrt(3)*400*.95);
  const fuse=[35,50,63,80,100,125].find(v=>v>=Ibt)||160,sw=[63,80,100,125,160].find(v=>v>=fuse)||200;
  const items=[];groups.forEach(g=>{const it=[{k:'fi',te:4,l:'-F'+g.id,s:g.In+'A '+g.t,gid:g.id}];g.idx.forEach(i=>it.push({k:'ls',te:rows[i].c.ph==3?3:1,l:rows[i].bmk,s:rows[i].c.ch+rows[i].c.In,ri:i,gid:g.id}));items.push(it)});
  const head=[{k:'main',te:4,l:'-Q1',s:sw+'A'},{k:'spd',te:4,l:'-F0',s:'SPD T2'}];
  const used=head.reduce((s,d)=>s+d.te,0)+items.flat().reduce((s,d)=>s+d.te,0),res=Math.ceil(used*(S.p.res||0)/100);
  const board=layout(head,items,res);
  const schief=pl.length?Math.max(...pl)-Math.min(...pl):0;
  const iss=rows.flatMap(r=>r.issues.map(i=>({r,i})));
  return{rows,groups,pl,schief,tot,sim,Ibt,fuse,sw,used,res,board,iss,err:rows.filter(r=>r.issues.some(i=>i[0]=='er')).length};
}
function layout(head,groups,res){
  const rows=[{x:0,sl:[]}];let cur=rows[0];
  const put=d=>{if(cur.x+d.te>24){cur={x:0,sl:[]};rows.push(cur)}cur.sl.push(Object.assign({x:cur.x},d));cur.x+=d.te};
  const grp=(arr)=>{const t=arr.reduce((s,d)=>s+d.te,0);if(t<=24&&cur.x+t>24&&cur.x>0){cur={x:0,sl:[]};rows.push(cur)}arr.forEach(put)};
  grp(head);groups.forEach(grp);
  let r=res;while(r>0){const free=24-cur.x;if(free<=0){cur={x:0,sl:[]};rows.push(cur);continue}const n=Math.min(free,r);cur.sl.push({k:'res',te:n,x:cur.x,l:'',s:''});cur.x+=n;r-=n}
  return rows;
}

    row.sl.forEach(d=>{const x=20+d.x*U,w=d.te*U-2,top=y+20,h=64;

      if(d.k=='ls'){s+=`<text class="tx" transform="translate(${x+w/2+3},${top+h-6}) rotate(-90)">${d.l} ${d.s}</text><rect x="${x+w/2-4}" y="${top+6}" width="8" height="14" rx="2" fill="var(--fg)" opacity=".75"/>`}

function Ctl(cv,cam,h){

  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};

    if(cam.bnd){cam.t[0]=cl(cam.t[0],cam.bnd[0],cam.bnd[1]);cam.t[2]=cl(cam.t[2],cam.bnd[2],cam.bnd[3])}};
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType=='mouse'&&e.button>2)return;
    try{cv.setPointerCapture(e.pointerId)}catch(x){}

    if(P.size==1){moved=0;start=p;last=p;hit=h.pick?h.pick(p[0],p[1]):null;
      mode=(e.button==2||e.button==1||e.shiftKey)?'pan':(h.grab&&h.grab(hit,p))?'drag':'orbit'}
    else{if(mode=='drag'&&h.cancelDrag)h.cancelDrag();mode='pinch';const[a,b]=[...P.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1]);last=[(a[0]+b[0])/2,(a[1]+b[1])/2];moved=9}
    h.request&&h.request()});
  cv.addEventListener('pointermove',e=>{
    const p=pos(e);
    if(!P.has(e.pointerId)){h.hover&&h.hover(p[0],p[1]);return}
    P.set(e.pointerId,p);INT=performance.now();
    if(P.size>=2){const[a,b]=[...P.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd>0&&d>0)cam.dist=clampD(cam.dist*pd/d);pd=d;const c=[(a[0]+b[0])/2,(a[1]+b[1])/2];pan(c[0]-last[0],c[1]-last[1]);last=c;h.request();return}
    const dx=p[0]-last[0],dy=p[1]-last[1];
    if(!moved&&Math.hypot(p[0]-start[0],p[1]-start[1])>6)moved=1;
    if(mode=='drag'){if(moved)h.drag(p[0],p[1])}
    else if(mode=='orbit'){if(moved||h.freeOrbit){cam.yaw-=dx*.008;if(!h.noPitch)cam.pitch=cl(cam.pitch+dy*.006,.04,1.52)}}
    else if(mode=='pan')pan(dx,dy);
    last=p;h.request()});
  const up=e=>{
    if(!P.has(e.pointerId))return;const p=pos(e);P.delete(e.pointerId);
    if(P.size==0){
      if(mode=='drag'){if(moved)h.dragEnd();else h.tap&&h.tap(p[0],p[1],hit)}
      else if((mode=='orbit'||mode=='pan')&&!moved)h.tap&&h.tap(p[0],p[1],hit);
      mode=null;hit=null}
    else if(P.size==1){mode='orbit';last=[...P.values()][0];moved=1}
    h.request()};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{if(mode=='drag'&&h.cancelDrag)h.cancelDrag();up(e)});
  if(!h.noWheel)cv.addEventListener('wheel',e=>{e.preventDefault();INT=performance.now();cam.dist=clampD(cam.dist*Math.exp(e.deltaY*.0012));h.request()},{passive:false});
  cv.addEventListener('contextmenu',e=>e.preventDefault());
}

  wm:{m:'floor',sz:[.6,.85,.6],col:'#e2e5e7'},tr:{m:'floor',sz:[.6,.85,.6],col:'#e2e5e7'},dle:{m:'wall',h:1.4,sz:[.22,.4,.13],col:'#e9ecee'},

let GEO={},MV=0,MC=null,curRoom=null;
const ROWD=4.4;
function layoutHouse(){
  GEO={};const R=S.rooms;H3=Math.max(2.2,Math.min(4,+S.h3||2.5));

    R.forEach(r=>{if(!r.g){const w=Math.max(1.9,Math.round((Math.max(3,+r.area||10)/ROWD)*20)/20);r.g={x:mx,z:0,W:w,D:ROWD};mx+=w;mz=Math.max(mz,ROWD)}
      const ar=+r.area||10;if(Math.abs(r.g.W*r.g.D-ar)>.06){r.g.W=Math.max(1,Math.round(ar/r.g.D*20)/20)}

    let MX=0,MZ=0;R.forEach(r=>{MX=Math.max(MX,r.g.x+r.g.W);MZ=Math.max(MZ,r.g.z+r.g.D)});GEO.__={W:MX||1,D:MZ||1};return}

function wallFrame(G,k,u){

    default:return{x:G.x,z:G.z+G.D-u,nx:1,nz:0,dx:0,dz:-1,len:G.D}}}
const mountOf=o=>o.t=='geraet'?(AP3[o.key]||AP3.herd).m:OB[o.t].m;
function dimsOf(o){

  if(o.t=='schalter')return[.082,.082,.016];

  const G=GEO[r.id];if(!G)return;const mt=mountOf(o),d=dimsOf(o);
  if(mt=='wall'){o.wall=((o.wall|0)%4+4)%4;const len=(o.wall%2?G.D:G.W),hw=d[0]/2+.03;o.u=cl(Math.round((+o.u||0)*20)/20,hw,Math.max(hw,len-hw));

function syncRoom(r){

function findVert(){for(const r of S.rooms)for(const o of r.objs||[])if(o.t=='verteiler')return{r,o};return null}
function placeVert(){

/* =====================================================================
   SIMULACIJA (prekidači, FI, LS, opterećenje, greške)
   ===================================================================== */
const SIM={main:true,fi:{},ls:{},lamp:{},plug:{},load:{},force:{},trip:{},fail:{},mark:{},log:[],spd:true};
let simHook=null;
function simReset(keepLamps){SIM.main=true;SIM.fi={};SIM.ls={};SIM.load={};SIM.force={};SIM.trip={};SIM.fail={};SIM.mark={};SIM.log=[];SIM.plug=SIM.plug;if(!keepLamps){SIM.lamp={};SIM.plug={}}}
function note(lv,txt,cid){const l=SIM.log;if(l.length&&l[l.length-1].txt==txt)return;l.push({lv,txt,cid,t:Date.now()});if(l.length>40)l.shift();simHook&&simHook(lv,txt)}
const fiOk=g=>SIM.fi[g]!==false&&!SIM.trip['fi'+g];
const lsOk=c=>SIM.ls[c.id]!==false&&!SIM.trip['ls'+c.id];
function en(c,m){const r=m.byId[c.id];return !!r&&SIM.main&&!SIM.trip.main&&fiOk(r.g)&&lsOk(c)}
function curI(c,m){
  if(!en(c,m))return 0;if(SIM.force[c.id]!=null)return SIM.force[c.id];
  const mem=members(c);let P=0;
  if(c.kind=='licht')P=mem.filter(x=>SIM.lamp[x.o.id]).length*50;
  else if(c.kind=='steck')P=mem.reduce((s,x)=>s+(SIM.plug[x.o.id]?(x.o.pw||1000):0),0);
  else P=SIM.load[c.id]?c.P:0;

function simEval(){
  const m=getModel();SIM.fail={};let changed=true,n=0;
  while(changed&&n++<6){changed=false;
    let tot=0;
    m.rows.forEach(r=>{
      const c=r.c;if(!en(c,m))return;const I=curI(c,m);tot+=I;
      const lab=r.bmk+' '+c.name;
      if(c.nfi&&c.nfi!=r.g&&I>.05){
        if(trip('fi'+r.g,`${lab}: Neutralleiter an FI -F${c.nfi} angeschlossen — Fehlerstrom-Differenz, FI -F${r.g} löst aus`,'er',c.id)){changed=true}
        if(m.groups.some(g=>g.id==c.nfi))trip('fi'+c.nfi,`FI -F${c.nfi} löst aus: fremder Neutralleiter von ${r.bmk}`,'er',c.id);return}
      if(I>1.45*c.In){if(trip('ls'+c.id,`${lab}: Überlast ${fmt(I)} A > 1,45·In — ${c.ch}${c.In} löst thermisch aus`,'wa',c.id))changed=true;return}
      if(I>r.Iz+.001){SIM.fail[c.id]=`${lab}: I ${fmt(I)} A > Iz ${fmt(r.Iz)} A — Querschnitt ${fa(c.A)} mm² zu klein, ${c.ch}${c.In} schützt nicht, Kabel überhitzt (Brandgefahr)`;note('er',SIM.fail[c.id],c.id)}
      if(c.pe===false&&I>.05){SIM.fail[c.id]=(SIM.fail[c.id]?SIM.fail[c.id]+' · ':'')+`${lab}: Schutzleiter (PE) nicht angeschlossen — Gehäuse kann Spannung führen`;note('er',`${lab}: PE fehlt — gefährlich unter Last`,c.id)}
    });

  }

function shortTest(cid){

function fiTest(gid,kind){

  if(!fiOk(gid)){note('wa',`FI -F${gid} ist ausgeschaltet`);return}
  if(kind=='T'){trip('fi'+gid,`FI -F${gid}: Prüftaste T — FI hat ausgelöst ✓`,'ok');return}
  if(kind=='30'){trip('fi'+gid,`FI -F${gid}: 30 mA Fehlerstrom — FI löst aus ✓ (Typ ${g.t})`,'ok');return}

    else if(needB){note('er',`FI -F${gid}: Typ ${g.t} erkennt Gleichfehlerstrom NICHT — Wallbox/Wärmepumpe braucht Typ B (oder Typ A + RDC-DD)`)}

function runTests(){
  const m=getModel(),res=[];
  m.rows.forEach(r=>{const c=r.c;
    r.issues.forEach(i=>res.push({lv:i[0],cid:c.id,t:`${r.bmk} ${c.name}: ${i[1]}`}));
    if(c.pe===false)res.push({lv:'er',cid:c.id,t:`${r.bmk} ${c.name}: Schutzleiter nicht angeschlossen`});
    if(c.nfi&&c.nfi!=r.g)res.push({lv:'er',cid:c.id,t:`${r.bmk} ${c.name}: Neutralleiter an falscher FI-Gruppe (-F${c.nfi} statt -F${r.g})`});
    const mm=members(c);if(c.auto&&!mm.length)res.push({lv:'wa',cid:c.id,t:`${r.bmk} ${c.name}: keine Verbraucher im 3D-Plan`});
    if(c.kind=='geraet'&&r.Ib>16&&c.ph==1)res.push({lv:'wa',cid:c.id,t:`${r.bmk} ${c.name}: Ib ${fmt(r.Ib)} A bei 1~ — 3~ prüfen`});
  });

  else{const sp=D.find(d=>d.k=='spd'),mi=D.findIndex(d=>d.k=='main'),si=D.indexOf(sp);if(mi>=0&&si<mi)add('er','SPD je ispred Hauptschaltera.',sp.id);else add('ok','SPD je iza Hauptschaltera.',sp.id)}

    else if(reqs.some(r=>r.fi=='B'))add('ok',`${nm}: Typ B za ${reqs.find(r=>r.fi=='B').n}.`,f.id);

  else if(a=='power'){const m=M.devs.find(d=>d.k=='main');if(!m){toast('Prvo ugradi Hauptschalter.');return}mLever(m);mSheet=null}
  else if(a=='reset'){M.devs=[];M.nid=1;mReset();mHand=null;mSel=null;mSheet=null}

  else if(a=='fit'){const d=M.devs.find(q=>q.id==+v);if(d)mFiTest(d)}
  else if(a=='del'){M.devs=M.devs.filter(q=>q.id!=+v);mSel=null;mSheet=null;mSim()}
  else if(a=='mv'||a=='mr'){const[id,dl]=v.split(':'),d=M.devs.find(q=>q.id==+id);if(d){

function pact(a,v){a=a.slice(2);const c=planCfg();
  const it=PL.selF!=null&&S.furn?S.furn.find(q=>q.id===PL.selF):null,op=PL.selP!=null&&S.ops?S.ops.find(q=>q.id===PL.selP):null;

  else if(a=='undo'){const h=PL.hist.pop();if(h){PL.redo.push(plSnap());plRestore(h);clearSel();PL.sheet=null;plCommit()}return}
  else if(a=='redo'){const h=PL.redo.pop();if(h){PL.hist.push(plSnap());plRestore(h);clearSel();PL.sheet=null;plCommit()}return}
  else if(a=='fit'){plFit()}
  else if(a=='proj'){PL.sheet=PL.sheet=='pproj'?null:'pproj';clearSel()}
  else if(a=='auto'){plPush();S.lay=undefined;S.rooms.forEach(r=>{delete r.g});plCommit();plFit();return}
  else if(a=='opsauto'){plPush();S.opsMan=false;S.ops=[];clearSel();plCommit();return}
  else if(a=='opsman'){plPush();opsFreeze();plCommit();return}
  else if(a=='furnauto'){plPush();S.furnMan=false;S.furn=[];clearSel();plCommit();return}
  else if(a=='furnman'){plPush();furnFreeze();plCommit();return}
  else if(a=='furnclear'){plPush();S.furnMan=true;S.furn=[];clearSel();plCommit();return}
  else if(a=='print'){PL.sheet='pprint';clearSel()}
  else if(a=='lay'){PL.lay[v]=!PL.lay[v]}
  else if(a=='snap'){c.snap=!plSnapOn();save()}
  else if(a=='dark'){c.dark=!c.dark;save()}
  else if(a=='fmt'){c.fmt=v;save()}
  else if(a=='pt'){c[v]=!c[v];save()}
  else if(a=='pdf'){planPDF();return}
  else if(a=='fm'||a=='wc'){const r=S.rooms.find(q=>q.id==PL.sel);if(!r)return;plPush();if(a=='fm')r.fm=v;else r.wc=v;plCommit();return}
  else if(a=='fc'&&it){plPush();it.c=v;plCommit();return}
  else if(a=='frot'&&it){plPush();it.ry=+((it.ry||0)+(+v)*Math.PI/180).toFixed(5);plCommit();return}
  else if(a=='fdup'&&it){plPush();const n=Object.assign({},it,{id:S.nid++,lx:it.lx+.3,lz:it.lz+.3});S.furn.push(n);PL.selF=n.id;plCommit();return}
  else if(a=='fdef'&&it){const e=CAT[it.k];plPush();it.w=e.w;it.d=e.d;it.h=e.h;it.y0=e.y0||0;plCommit();return}
  else if(a=='fdel'&&it){plPush();S.furn=S.furn.filter(q=>q!==it);clearSel();PL.sheet=null;plCommit();return}
  else if(a=='hinge'&&op){plPush();op.hinge=v;plCommit();return}
  else if(a=='out'&&op){plPush();op.out=v=='1';plCommit();return}
  else if(a=='opdup'&&op){plPush();const n=Object.assign({},op,{id:S.nid++,u:op.u+op.w+.3});S.ops.push(n);PL.selP=n.id;plCommit();return}
  else if(a=='opdel'&&op){plPush();S.ops=S.ops.filter(q=>q!==op);clearSel();PL.sheet=null;plCommit();return}
  else if(a=='rot'||a=='dup'||a=='del'){const r=S.rooms.find(q=>q.id==PL.sel);if(!r)return;plPush();plFreeze();
    if(a=='rot'){const g=Object.assign({},r.g,{W:r.g.D,D:r.g.W});if(plOverlap(r,g)){toast('Nema mjesta za rotaciju.');PL.hist.pop();return}r.g=g}
    if(a=='dup'){const n=mkRoom(r.type,r.name+' 2',r.area,r.wert||2);n.fm=r.fm;n.wc=r.wc;S.rooms.push(n);ensureAll();const bb=planBBox();n.g={x:bb.x1-WT_EXT,z:r.g.z,W:r.g.W,D:r.g.D};clearSel();PL.sel=n.id}
    if(a=='del'){snap0();S.rooms=S.rooms.filter(q=>q!==r);clearSel();PL.sheet=null;ensureAll()}
    plCommit();return}
  else if(a=='to3d'){curRoom=PL.sel;go('kuca3d');return}

  plBars();showSheet();PL.dirty=true}
function plInput(t){const D=t.dataset,c=planCfg();

    if(k=='c')it.c=t.value;else if(k=='rot')it.ry=+((+t.value||0)*Math.PI/180).toFixed(5);else{const v=cnum(t.value)/100;if(!isFinite(v)){PL.hist.pop();return true}it[k]=k=='y0'?Math.max(0,v):Math.max(.01,v)}

    if(k=='kind'){op.kind=t.value;const def=Object.values(OPK).find(e=>e.kind==t.value);if(def){op.h=def.h;op.y0=def.y0}}else{const v=cnum(t.value)/100;if(!isFinite(v)){PL.hist.pop();return true}op[k]=k=='y0'?Math.max(0,v):k=='u'?v:Math.max(.3,v)}
    plCommit();return true}
  if(D.pr){const r=S.rooms.find(q=>q.id==PL.sel);if(!r)return true;const k=D.pr;
    if(k=='wc'){plPush();r.wc=t.value;plCommit();return true}

    if(k=='type'){const ap=r.objs.filter(o=>o.t=='geraet').map(o=>o.key);r.type=t.value;const tt=RT[r.type];r.s=tt.s[(r.wert||2)-1];r.l=tt.l[(r.wert||2)-1];r.w=tt.w[(r.wert||2)-1];r.ap=ap;r.objs=null;ensureAll();plCommit();return true}
    const v=cnum(t.value)/100;if(!isFinite(v))return true;plPush();plFreeze();const g=Object.assign({},r.g);
    if(k=='W')g.W=Math.max(1.2,sn5(v));if(k=='D')g.D=Math.max(1.2,sn5(v));if(k=='x')g.x=sn5(v);if(k=='z')g.z=sn5(v);
    if(plOverlap(r,g)){toast('Prostorije bi se preklapale.');PL.hist.pop();showSheet();return true}r.g=g;plCommit();return true}
  return false}

function startV(v,cvs){
  v.dirty=true;
  const fit=()=>{cvs.forEach(c=>{const b=c.cv.getBoundingClientRect(),dpr=S.ui.hq===false?1:Math.max(1,Math.min(2,window.devicePixelRatio||1)*QS);c.W=Math.max(10,b.width);c.H=Math.max(10,b.height);
    c.cv.width=Math.round(c.W*dpr);c.cv.height=Math.round(c.H*dpr);c.ctx.setTransform(dpr,0,0,dpr,0,0)});v.dirty=true};
  v.fit=fit;
  if(window.ResizeObserver){v.ro=new ResizeObserver(fit);cvs.forEach(c=>v.ro.observe(c.cv))}else{addEventListener('resize',fit);const s0=v.stop;v.stop=()=>{removeEventListener('resize',fit);s0&&s0()}}
  fit();let last=performance.now();
  if(v.cam&&FLY&&!matchMedia('(prefers-reduced-motion:reduce)').matches){FLY=false;const c=v.cam,dr0=v.draw,an0=v.anim;let ft=0,pf=1.6,py=-.55;c.dist*=pf;c.yaw+=py;
    const setF=e=>{const f=1.6-.6*e,y=-.55*(1-e);c.dist*=f/pf;c.yaw+=y-py;pf=f;py=y};
    v.flyEnd=()=>{if(ft<1){ft=1;setF(1)}};
    v.draw=(t,dt)=>{if(ft<1){ft=Math.min(1,ft+dt/1.25);setF(1-Math.pow(1-ft,3))}dr0(t,dt)};v.anim=dt=>ft<1||(an0?an0(dt):false);
    cvs[0].cv.addEventListener('pointerdown',v.flyEnd,{once:true});cvs[0].cv.addEventListener('wheel',v.flyEnd,{once:true,passive:true})}
  let lastD=0,wasF=false,samp=[];

    const an=v.anim?v.anim(dt):false,fN=performance.now()-INT<200;if(wasF&&!fN)v.dirty=true;wasF=fN;if(!v.dirty&&!an)return;
    const gap=t-lastD;lastD=t;v.dirty=false;try{v.draw(t/1000,dt)}catch(e){console.error(e);v.err=String(e)}

    if(gap<120){samp.push(gap);if(samp.length>=30){const avg=samp.reduce((a,b)=>a+b,0)/samp.length;samp=[];if(avg>30&&QS>.5&&(window.devicePixelRatio||1)*QS>1.01){QS=Math.max(.5,QS-.25);fit()}}}else samp=[]};
  v.raf=requestAnimationFrame(tick)}

function wallCands(ray){let best=null;
  for(const r of S.rooms){const G=GEO[r.id];if(!G)continue;
    for(let k=0;k<4;k++){const F=wallFrame(G,k,0),dn=F.nx*ray.d[0]+F.nz*ray.d[2];if(dn>=-1e-4)continue;
      const t=(F.nx*(F.x-ray.o[0])+F.nz*(F.z-ray.o[2]))/dn;if(t<=0)continue;
      const q=[ray.o[0]+ray.d[0]*t,ray.o[1]+ray.d[1]*t,ray.o[2]+ray.d[2]*t];if(q[1]<0||q[1]>H3)continue;
      const u=(q[0]-F.x)*F.dx+(q[2]-F.z)*F.dz;if(u<0||u>F.len)continue;
      if(!best||t<best.t)best={t,r,k,u:Math.round(u*20)/20,y:q[1]}}}
  return best}
function planeHit(ray,y){if(Math.abs(ray.d[1])<1e-5)return null;const t=(y-ray.o[1])/ray.d[1];if(t<=0)return null;return[ray.o[0]+ray.d[0]*t,y,ray.o[2]+ray.d[2]*t]}
function roomAt(x,z){return S.rooms.find(r=>{const G=GEO[r.id];return G&&x>=G.x&&x<=G.x+G.W&&z>=G.z&&z<=G.z+G.D})}

function defCabCam(m){const rows=Math.max(1,m.board.length),bh=rows*.15+.17;return{yaw:.32,pitch:.14,dist:Math.max(1.3,bh*1.9+.6),t:[0,bh/2,0],fov:.7,near:.02,min:.35,max:4.5}}

function addObjAt(room,t,sub,key){
  const G=GEO[room.id],eye=V3&&V3.kind=='house'?camEye(CAM.h):[G.x+G.W/2,5,G.z+G.D+8];
  const o={id:S.nid++,t};
  if(t=='steck'){o.g=+sub||1;o.pw=1000}else if(t=='schalter')o.sub=sub||'aus';else if(t=='licht')o.sub=sub||'decke';else if(t=='geraet')o.key=key;
  const mt=mountOf(o);
  if(mt=='wall'){let bk=0,bs=-1e9;for(let k=0;k<4;k++){const F=wallFrame(G,k,G.W/2),s=F.nx*(eye[0]-F.x)+F.nz*(eye[2]-F.z);if(s>bs){bs=s;bk=k}}
    o.wall=bk;const F0=wallFrame(G,bk,0),len=F0.len;
    o.h=t=='geraet'?AP3[key].h:OB[t].h;if(t=='steck'&&room.type=='Küche')o.h=1.1;
    let best=len/2,bd=-1;for(let i=0;i<=20;i++){const u=.4+(len-.8)*i/20;let dmin=9;room.objs.forEach(q=>{if(mountOf(q)=='wall'&&q.wall==bk)dmin=Math.min(dmin,Math.abs(q.u-u))});if(dmin>bd){bd=dmin;best=u}}
    o.u=Math.round(best*20)/20}
  else if(mt=='ceil'){let best=[G.W/2,G.D/2],bd=-1;for(let i=1;i<6;i++)for(let j=1;j<4;j++){const x=G.W*i/6,z=G.D*j/4;let dm=9;room.objs.forEach(q=>{if(q.t=='licht')dm=Math.min(dm,Math.hypot(q.x-x,q.z-z))});if(dm>bd){bd=dm;best=[x,z]}}
    o.x=Math.round(best[0]*20)/20;o.z=Math.round(best[1]*20)/20}
  else{const a=AP3[key];let best=[G.W/2,G.D/2],bd=-1;for(let i=1;i<6;i++)for(let j=1;j<4;j++){const x=G.W*i/6,z=G.D*j/4;let dm=9;room.objs.forEach(q=>{if(mountOf(q)=='floor')dm=Math.min(dm,Math.hypot(q.x-x,q.z-z))});if(dm>bd){bd=dm;best=[x,z]}}
    o.x=Math.round(best[0]*20)/20;o.z=Math.round(best[1]*20)/20;o.rot=0}
  room.objs.push(o);return o}

  if(hh||a.startsWith('h:')||a.startsWith('r:')){
    if(a=='h:add'){const[t,s]=v.split(':'),r=curR();if(!r)return;snap0();const o=addObjAt(r,t,s);selO=o.id;sheet='obj';hintOn=false;afterEdit();toast('Dodano: '+tName(o),true);return}

    const f=selO&&findObj(selO);
    if(a=='h:del'&&f){snap0();f.r.objs=f.r.objs.filter(q=>q!==f.o);selO=null;sheet=null;afterEdit();toast('Uklonjeno',true);return}

    if(a=='h:wall'&&f){f.o.wall=+v;afterEdit();return}
    if(a=='h:slide'&&f){f.o.u=(f.o.u||0)+.1*+v;afterEdit();return}
    if(a=='h:h'&&f){f.o.h=(f.o.h||1)+.05*+v;afterEdit();return}
    if(a=='h:hset'&&f){f.o.h=+v/100;afterEdit();return}
    if(a=='h:mv'&&f){const[dx,dz]=v.split(',').map(Number);f.o.x=(f.o.x||0)+dx*.1;f.o.z=(f.o.z||0)+dz*.1;afterEdit();return}
    if(a=='h:rot'&&f){f.o.rot=((f.o.rot|0)+1)%4;afterEdit();return}
    if(a=='h:gang'&&f){f.o.g=+v;afterEdit();return}
    if(a=='h:lk'&&f){const ls=f.r.objs.filter(q=>q.t=='licht').map(q=>q.id),id=+v;let lk=f.o.lk&&f.o.lk.length?f.o.lk.slice():ls.slice();
      lk=lk.includes(id)?lk.filter(x=>x!=id):lk.concat(id);f.o.lk=lk.length==ls.length?[]:lk;afterEdit();return}
    if(a=='r:area'){const r=curR();r.area=Math.max(3,r.area+ +v);afterEdit();return}
    if(a=='r:add'||a=='r:rem'){const r=curR();snap0();
      if(a=='r:add'){const o=addObjAt(r,v,v=='schalter'?'aus':v=='licht'?'decke':'1');selO=o.id}
      else{const l=[...r.objs].reverse().find(o=>o.t==v);if(l)r.objs=r.objs.filter(o=>o!==l)}
      afterEdit();return}
    if(a=='r:reseed'){const r=curR();snap0();syncRoom(r);const ap=r.ap.slice();r.objs=null;r.ap=ap;ensureAll();afterEdit();return}
